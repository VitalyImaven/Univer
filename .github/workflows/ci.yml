name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Content validation, unit tests, type-check and build
        run: npm run check
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (phone, tablet, desktop)
        run: npm run test:e2e
